<!DOCTYPE html>
<html lang="en" data-app="deckside">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Deckside">
<meta name="color-scheme" content="dark light">
<script>
  // Appearance: "auto" (follows the iPad), "light" (warm) or "dark". Applied before first paint.
  (function () {
    var pref = 'auto';
    try { pref = localStorage.getItem('decksideTheme') || 'auto'; } catch (e) {}
    var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: light)') : null;
    function apply() {
      var t = pref === 'auto' ? (mq && mq.matches ? 'light' : 'dark') : pref;
      document.documentElement.setAttribute('data-theme', t);
    }
    window.__setTheme = function (p) { pref = p; try { localStorage.setItem('decksideTheme', p); } catch (e) {} apply(); };
    window.__getTheme = function () { return pref; };
    if (mq) { (mq.addEventListener ? mq.addEventListener('change', apply) : mq.addListener(apply)); }
    apply();
  })();
</script>
<title>Deckside</title>
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/icon.png">
<style>
  /* ------------------------------------------------------------------ tokens
     Apple system palette. Dark is the wall-panel default; light follows the iPad's setting.
     Contrast (WCAG, dark / light): label on card 17.0 / 21.0 · label2 on card 7.7 / 5.2 · red text 6.0 / 5.4 ·
     orange text 9.5 / 5.2 - all ≥ 4.5:1. Play icon on accent 3.7 / 4.0 (non-text, ≥ 3:1). */
  :root, :root[data-theme="dark"] {
    --bg: #000000; --card: #1c1c1e; --fill: #2c2c2e; --fill2: #3a3a3c; --sep: #38383a;
    --label: #ffffff; --label2: #aeaeb2; --label3: #8e8e93;
    --accent: #0a84ff; --accent-bg: rgba(10,132,255,.22); --on-accent: #ffffff;
    --green: #30d158; --orange: #ff9f0a; --red: #ff453a; --red-text: #ff6961; --orange-text: #ffb340;
    --crit-bg: rgba(255,69,58,.14); --warn-bg: rgba(255,159,10,.14);
    --glass: rgba(40,40,44,.55); --glass-edge: rgba(255,255,255,.16); --glass-hi: rgba(255,255,255,.22);
    --glass-sel: rgba(255,255,255,.13); --glass-opaque: #2c2c2e; --sheet: rgba(30,30,32,.80);
    --vfill: #f2f2f7; --vicon-on: #1c1c1e;
    --shadow: 0 10px 34px rgba(0,0,0,.55);
    --ambient: radial-gradient(140% 90% at 0% -20%, rgba(10,132,255,.16), rgba(10,132,255,0) 70%);
  }
  /* Warm light: paper-toned background, never pure white. Contrast on card: label 16.2 · label2 6.0 ·
     accent text 5.3 · red text 6.3 · orange text 6.1 · white on accent 5.6 · white on red 5.0 (all ≥ 4.5:1). */
  :root[data-theme="light"] {
    --bg: #f4eee4; --card: #fbf8f2; --fill: #ede6da; --fill2: #e0d7c8; --sep: #e3dacb;
    --label: #1f1b16; --label2: #675e50; --label3: #8a8072;
    --accent: #0064d2; --accent-bg: rgba(0,100,210,.12); --on-accent: #ffffff;
    --green: #248a3d; --orange: #c26a00; --red: #d42a20; --red-text: #b8141b; --orange-text: #9a4700;
    --crit-bg: rgba(212,42,32,.10); --warn-bg: rgba(194,106,0,.12);
    --glass: rgba(251,247,240,.58); --glass-edge: rgba(70,50,20,.12); --glass-hi: rgba(255,255,255,.75);
    --glass-sel: rgba(70,50,20,.08); --glass-opaque: #f7f2ea; --sheet: rgba(251,248,242,.86);
    --vfill: #3d362d; --vicon-on: #fbf8f2;
    --shadow: 0 10px 30px rgba(80,60,30,.16);
    --ambient: radial-gradient(140% 90% at 0% -20%, rgba(255,186,120,.30), rgba(255,186,120,0) 70%);
  }
  * { box-sizing: border-box; }
  /* ambient glow covers the whole viewport (fixed layer), so it never stops above the tab bar */
  html { background: var(--bg); }
  body::before { content: ""; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-image: var(--ambient);
    pointer-events: none; z-index: -1; }
  html, body { margin: 0; min-height: 100%; background-color: var(--bg); color: var(--label);
    font-family: -apple-system, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 17px; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation;
    -webkit-appearance: none; appearance: none; padding: 0; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  svg { display: block; }

  /* ------------------------------------------------------------------ pages */
  .page { display: none; padding: 22px 24px 140px; padding-top: calc(22px + env(safe-area-inset-top));
    max-width: 1320px; margin: 0 auto; -webkit-animation: fade .18s ease-out; animation: fade .18s ease-out; }
  .page.on { display: block; }
  @-webkit-keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  .phead { display: flex; align-items: flex-end; justify-content: space-between; margin: 0 4px 18px; }
  .phead h1 { font-size: 34px; line-height: 41px; font-weight: 700; margin: 0; letter-spacing: .3px; }
  .phead .meta { display: flex; align-items: center; color: var(--label2); font-size: 15px; margin-top: 2px; }
  .clock { font-size: 34px; line-height: 41px; font-weight: 300; color: var(--label2);
    font-variant-numeric: tabular-nums; }

  .grid { display: flex; flex-wrap: wrap; margin: -8px; }
  .col { flex: 1 1 420px; margin: 8px; min-width: 0; }
  .card { background: var(--card); border-radius: 22px; padding: 18px 20px; margin-bottom: 16px; }
  .col .card:last-child { margin-bottom: 0; }
  .eyebrow { font-size: 13px; font-weight: 600; color: var(--label2); text-transform: uppercase; letter-spacing: .6px;
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .eyebrow b { color: var(--label); font-size: 17px; letter-spacing: 0; text-transform: none; font-variant-numeric: tabular-nums; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--label3);
    margin-right: 8px; flex: 0 0 auto; }
  .dot.ok { background: var(--green); } .dot.warn { background: var(--orange); } .dot.crit { background: var(--red); }
  .hint { color: var(--label2); font-size: 15px; line-height: 1.45; }
  code { background: var(--fill); padding: 1px 6px; border-radius: 6px; font-size: 14px; }
  .muted { opacity: .38; pointer-events: none; }
  .press:active { -webkit-transform: scale(.95); transform: scale(.95); opacity: .8; }

  /* ------------------------------------------------------------------ Mac page */
  /* now-playing card fills its column so both columns end on the same line */
  #page-mac .col:first-child { display: flex; }
  #np-card { flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center; position: relative;
    overflow: hidden; }
  /* artwork wash: content layer (blurred artwork behind the card content), not glass */
  .np-bg { position: absolute; top: -20%; left: -20%; width: 140%; height: 140%; object-fit: cover; opacity: 0;
    -webkit-filter: blur(48px) saturate(1.5); filter: blur(48px) saturate(1.5); -webkit-transition: opacity .6s; transition: opacity .6s; }
  .np-bg.on { opacity: .55; }
  .np-shade { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: var(--card); opacity: .5; }
  .np-inner { position: relative; }
  .art { width: 220px; height: 220px; margin: 6px auto 0; border-radius: 18px; background: var(--fill); overflow: hidden;
    box-shadow: 0 14px 40px rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; }
  .art img { width: 100%; height: 100%; object-fit: cover; display: none; }
  .art.has img { display: block; } .art.has svg { display: none; }
  .art svg { width: 72px; height: 72px; fill: var(--label3); }
  .np { text-align: center; padding: 18px 10px 4px; }
  .np-app { font-size: 13px; font-weight: 600; color: var(--label2); text-transform: uppercase; letter-spacing: .6px;
    min-height: 18px; }
  #np-title { font-size: 28px; line-height: 34px; font-weight: 700; margin-top: 10px; display: -webkit-box;
    -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  #np-artist { font-size: 20px; color: var(--label2); margin-top: 6px; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; }
  .scrub { padding: 10px 8px 0; }
  .scrub input[type=range] { height: 36px; }
  .scrub input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; }
  .scrub input[type=range]::-webkit-slider-thumb { width: 22px; height: 22px; margin-top: -8px; }
  .times { display: flex; justify-content: space-between; font-size: 13px; color: var(--label2); font-variant-numeric: tabular-nums;
    margin-top: -2px; }
  .transport { display: flex; justify-content: center; align-items: center; padding: 14px 0 10px; }
  .tbtn { width: 72px; height: 72px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    color: var(--label); margin: 0 8px; }
  .tbtn svg { width: 38px; height: 38px; fill: currentColor; }
  .tbtn.skip svg { width: 34px; height: 34px; }
  .tbtn.primary { width: 96px; height: 96px; background: var(--accent); color: var(--on-accent); margin: 0 14px; }
  .tbtn.primary svg { width: 46px; height: 46px; }
  .tbtn[disabled] { opacity: .3; }

  .mic { display: flex; align-items: center; margin-bottom: 14px; }
  .chips2 { display: flex; flex-wrap: wrap; margin: -4px; }
  .chips2 .out { flex: 1 1 170px; min-height: 52px; margin: 4px; font-size: 16px; }
  .batt { display: flex; align-items: center; font-size: 17px; font-weight: 600; margin-right: 18px;
    font-variant-numeric: tabular-nums; color: var(--label); }
  .batt svg { width: 34px; height: 18px; margin-right: 6px; }
  .batt .bolt { width: 12px; height: 18px; margin: 0 0 0 4px; fill: var(--green); }
  .batt.low { color: var(--red-text); }
  .hright { display: flex; align-items: center; }

  .vol { display: flex; align-items: center; }
  .ibtn { width: 56px; height: 56px; border-radius: 16px; background: var(--fill); display: flex; align-items: center;
    justify-content: center; flex: 0 0 auto; color: var(--label); }
  .ibtn svg { width: 26px; height: 26px; fill: currentColor; }
  .ibtn.active { background: var(--red); color: #fff; }
  .slider-wrap { flex: 1 1 auto; margin: 0 14px; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 56px; background: transparent; margin: 0; }
  input[type=range]::-webkit-slider-runnable-track { height: 10px; border-radius: 5px; background: var(--fill2); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 34px; height: 34px; border-radius: 50%;
    background: #fff; margin-top: -12px; box-shadow: 0 1px 6px rgba(0,0,0,.35), 0 0 0 .5px rgba(0,0,0,.08); }
  input[type=range]:disabled { opacity: .35; }
  .presets { display: flex; margin: 14px -5px 0; }
  .presets button { flex: 1 1 0; margin: 0 5px; height: 44px; border-radius: 12px; background: var(--fill);
    color: var(--label); font-size: 15px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .outs { display: flex; flex-wrap: wrap; margin: -5px; }
  .out { flex: 1 1 190px; margin: 5px; min-height: 60px; border-radius: 16px; background: var(--fill);
    text-align: left; padding: 10px 16px; display: flex; align-items: center; font-size: 17px; }
  .out .radio { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--label3); margin-right: 12px; flex: 0 0 auto; }
  .out.active { background: var(--accent-bg); }
  .out.active .radio { border-color: var(--accent); background: var(--accent); box-shadow: inset 0 0 0 4px var(--card); }

  /* ------------------------------------------------------------------ tab bar (the only glass surface) */
  .edge { display: none; position: fixed; left: 0; right: 0; bottom: 0; height: 120px; pointer-events: none;
    background: -webkit-linear-gradient(bottom, var(--bg) 25%, rgba(0,0,0,0));
    background: linear-gradient(to top, var(--bg) 25%, transparent); }
  .tabbar { position: fixed; left: 50%; bottom: 18px; bottom: calc(14px + env(safe-area-inset-bottom));
    -webkit-transform: translateX(-50%); transform: translateX(-50%); display: flex; padding: 6px;
    border-radius: 999px; background: var(--glass-opaque); border: .5px solid var(--glass-edge);
    box-shadow: inset 0 1px 0 var(--glass-hi), inset 0 -1px 0 rgba(0,0,0,.08), var(--shadow); }
  /* Liquid Glass lives ONLY on the floating controls layer: tab bar, header capsule buttons, sheets.
     Content (cards, keys) stays solid. Specular top edge + soft refraction of the ambient background. */
  .gbtn { height: 44px; min-width: 44px; padding: 0 16px; border-radius: 22px; display: inline-flex; align-items: center;
    justify-content: center; font-size: 17px; font-weight: 600; color: var(--accent);
    background: var(--glass-opaque); border: .5px solid var(--glass-edge);
    box-shadow: inset 0 1px 0 var(--glass-hi), 0 4px 14px rgba(0,0,0,.18); }
  .gbtn svg { width: 22px; height: 22px; fill: currentColor; }
  .gbtn.icon { padding: 0; width: 44px; color: var(--label); }
  .gbtn.on { background: var(--accent); color: var(--on-accent); border-color: transparent; }
  .sheet { border: .5px solid var(--glass-edge); box-shadow: inset 0 1px 0 var(--glass-hi), 0 24px 70px rgba(0,0,0,.45); }
  @supports ((-webkit-backdrop-filter: blur(1px)) or (backdrop-filter: blur(1px))) {
    .tabbar { background: var(--glass); -webkit-backdrop-filter: blur(30px) saturate(1.8); backdrop-filter: blur(30px) saturate(1.8); }
    .gbtn:not(.on) { background: var(--glass); -webkit-backdrop-filter: blur(20px) saturate(1.6); backdrop-filter: blur(20px) saturate(1.6); }
    .sheet { background: var(--sheet); -webkit-backdrop-filter: blur(40px) saturate(1.6); backdrop-filter: blur(40px) saturate(1.6); }
    .backdrop { background: rgba(0,0,0,.28); }
  }
  @media (prefers-reduced-transparency: reduce) {
    .tabbar, .gbtn:not(.on) { background: var(--glass-opaque); -webkit-backdrop-filter: none; backdrop-filter: none; }
    .sheet { background: var(--card); -webkit-backdrop-filter: none; backdrop-filter: none; }
  }
  @media (prefers-contrast: more) {
    .tabbar, .gbtn:not(.on), .sheet { background: var(--glass-opaque); border: 1.5px solid var(--label3); }
    .card { box-shadow: inset 0 0 0 1px var(--sep); }
  }
  .tab { position: relative; width: 148px; height: 62px; border-radius: 999px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; color: var(--label2); }
  .tab svg { width: 28px; height: 28px; fill: currentColor; }
  .tab span { font-size: 12px; line-height: 15px; font-weight: 600; margin-top: 3px; }
  .tab[aria-selected="true"] { background: var(--glass-sel); color: var(--accent); box-shadow: inset 0 1px 0 var(--glass-hi); }

  @media (prefers-reduced-motion: reduce) {
    .page { -webkit-animation: none; animation: none; }
    .press:active { -webkit-transform: none; transform: none; }
  }

  /* ------------------------------------------------------------------ Mac page: Control Center */
  .cc { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .cc > .card { margin: 0; border-radius: 28px; }
  .cc-np { grid-column: span 2; }
  .cc-level { display: flex; flex-direction: column; align-items: center; padding: 18px; height: 380px; }
  .cc-level .eyebrow { width: 100%; margin-bottom: 12px; }
  .cc-level .eyebrow b { font-size: 20px; }
  .vslider { position: relative; flex: 1 1 auto; width: 108px; min-height: 150px; border-radius: 30px; background: var(--fill2);
    overflow: hidden; touch-action: none; cursor: ns-resize; }
  .vslider:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .vfill { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: var(--vfill); -webkit-transition: height .15s; transition: height .15s; }
  .vslider.drag .vfill { -webkit-transition: none; transition: none; }
  .vicon { position: absolute; left: 50%; bottom: 16px; width: 28px; height: 28px; margin-left: -14px; fill: var(--vicon-on); }
  .vslider.low .vicon { fill: var(--label); }
  .vslider.disabled { opacity: .35; pointer-events: none; }
  .cc-btn { width: 100%; height: 44px; margin-top: 12px; border-radius: 14px; background: var(--fill); color: var(--label);
    font-size: 15px; font-weight: 600; flex: 0 0 auto; }
  .cc-btn.active { background: var(--red); color: #fff; }
  .cc-btn[disabled] { opacity: .35; }
  .cc-dev { grid-column: span 2; display: flex; flex-direction: column; justify-content: center; padding: 10px 14px; }
  .devrow { display: flex; align-items: center; width: 100%; min-height: 56px; text-align: left; padding: 0 4px; }
  .dico { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; margin-right: 12px; }
  .dico svg { width: 20px; height: 20px; fill: none; stroke: #fff; stroke-width: 2; }
  .dtxt { display: flex; flex-direction: column; flex: 1 1 auto; min-width: 0; }
  .dlbl { font-size: 12px; font-weight: 600; letter-spacing: .5px; text-transform: uppercase; color: var(--label2); }
  .dname { font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chev { width: 18px; height: 18px; fill: none; stroke: var(--label3); stroke-width: 2; flex: 0 0 auto; margin-left: 8px; }
  .dsep { height: .5px; background: var(--sep); margin: 4px 4px 4px 52px; }
  .plist .prow .check { margin-left: auto; width: 20px; height: 20px; fill: none; stroke: var(--accent); stroke-width: 2.6; }

  /* ------------------------------------------------------------------ Mac page: Studio Minimal (type + hairlines, no cards) */
  .page .phead { border-bottom: .5px solid var(--sep); padding-bottom: 12px; margin-bottom: 0; }
  .page .phead h1 { font-size: 17px; line-height: 22px; font-weight: 600; letter-spacing: 0; }
  .page .phead > div:first-child { display: flex; align-items: baseline; }
  .page .phead .meta { margin: 0 0 0 14px; font-size: 15px; }
  .page .phead .meta .dot { width: 7px; height: 7px; align-self: center; }
  .page .clock { font-size: 17px; line-height: 22px; font-weight: 400; }
  .page .settings-btn { background: none; box-shadow: none; border: 1px solid var(--fill2); -webkit-backdrop-filter: none; backdrop-filter: none; }
  #deck-edit, #deck-edit.on { background: none; border: 0; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none;
    color: var(--accent); padding: 0 6px; min-width: 0; }
  .sm-eyebrow, .eyebrow-m { font-size: 13px; font-weight: 600; letter-spacing: 1.4px; text-transform: uppercase; color: var(--label2); }

  /* ------------------------------------------------------------------ Deck: Studio Minimal (hairline grid, text tabs) */
  #page-deck .pager { margin: 0 0 14px; height: 46px; align-items: flex-end; flex-wrap: nowrap; overflow-x: auto; }
  #page-deck .pill { height: 44px; padding: 0 2px; margin: 0 26px 0 0; border-radius: 0; background: none; color: var(--label2);
    font-size: 17px; font-weight: 400; border-bottom: 2px solid transparent; flex: 0 0 auto; }
  #page-deck .pill.on { color: var(--label); font-weight: 600; border-bottom-color: var(--label); background: none; }
  #page-deck .pill.add { border: 0; border-bottom: 2px solid transparent; color: var(--accent); font-weight: 600; }
  #page-deck .keys { margin: 0; border-top: .5px solid var(--sep); border-left: .5px solid var(--sep); }
  #page-deck .key { width: 16.6666%; margin: 0; border-radius: 0; background: none; height: 168px;
    border-right: .5px solid var(--sep); border-bottom: .5px solid var(--sep); padding: 10px 8px; }
  #page-deck .key:active { -webkit-transform: none; transform: none; background: var(--fill); }
  #page-deck .key.front { box-shadow: none; background: var(--card); }
  #page-deck .key.front::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--accent); }
  #page-deck .key.flash { box-shadow: none; background: var(--accent-bg); }
  #page-deck .key .ico { width: 72px; height: 72px; }
  #page-deck .key .lbl { margin-top: 12px; font-size: 15px; font-weight: 400; }
  #page-deck .key.front .lbl { font-weight: 600; }
  #page-deck .key .run { display: none; }
  #page-deck .key.running .lbl::before { content: ""; display: inline-block; width: 5px; height: 5px; border-radius: 3px;
    background: var(--label2); margin-right: 6px; vertical-align: 3px; }
  #page-deck .key.front .lbl::before { background: var(--accent); }
  #page-deck .key .glyph { width: 72px; height: 72px; margin: 0; border-radius: 36px; background: none; border: 1px solid var(--fill2);
    color: var(--label); box-shadow: none; }
  #page-deck .key .glyph svg { width: 30px; height: 30px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linejoin: round; }
  #page-deck .glyph.keys { border: 0; border-radius: 0; width: auto; min-width: 72px; font-weight: 300; letter-spacing: 3px; color: var(--label); }
  #page-deck .glyph.keys .appbadge { position: absolute; right: -32px; top: 50%; bottom: auto; width: 24px; height: 24px; margin-top: -12px; filter: none; }
  #page-deck .glyph.multi { flex-direction: column; }
  #page-deck .glyph.multi .n { font-size: 24px; line-height: 26px; font-weight: 300; }
  #page-deck .glyph.multi .u { font-size: 10px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--label2); }
  #page-deck .glyph.letter { border-radius: 17px; border: 0; background: var(--fill); }
  #page-deck .key.addkey { border: 0; border-right: .5px solid var(--sep); border-bottom: .5px solid var(--sep); }
  #page-deck .key.addkey .glyph { border: 1px dashed var(--accent); color: var(--accent); font-size: 36px; font-weight: 200; }
  #page-deck .key .badge-x { top: 8px; left: 8px; }
  /* Deck v2 · Focus: app in front (2-col keys) + favourites (3-col) */

  /* ------------------------------------------------------------------ fit-to-screen (landscape iPad, no scroll)
     Budget at 1024x768: header ~70 + tab bar ~80 = 150, leaving ~600 for the cards. */

    /* artwork scales with the screen height */

    /* mac: Studio Minimal fills the screen without scrolling */

    .sm .art { width: clamp(96px, calc(100vh - 620px), 148px); height: clamp(96px, calc(100vh - 620px), 148px); }

    /* deck */

  /* ================================================================== responsive shell (any iPad, phone or desktop)
     Each page is exactly the screen height (JS sets --app-h from innerHeight, which is right on iOS Safari where
     100vh is not) and its content area flexes to fill it; grids divide that space instead of fixed pixel heights.
     Size class on <html>, set by layout(): sz-l landscape tablet/desktop · sz-m tablet portrait ·
     sz-s phone portrait · sz-x short landscape (phone). Last resort: fitPane() shrinks a page that still overflows. */
  :root { --app-h: 100vh; --tab-h: 84px; }
  .page.on { display: flex; flex-direction: column; height: var(--app-h); box-sizing: border-box; overflow: hidden;
    padding-bottom: var(--tab-h); }
  .page .phead { flex: 0 0 auto; }
  .page .phead > div:first-child { min-width: 0; }
  .page .phead .meta { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .page .phead .meta span:last-child { overflow: hidden; text-overflow: ellipsis; }
  .hright { display: flex; align-items: center; flex: 0 0 auto; }
  .sm, .dk-split { flex: 1 1 auto; min-height: 0; height: auto; box-sizing: border-box; }
  .sm { flex-wrap: nowrap; }
  /* deck: grids fill their column; fitDeck() picks the favourites' columns/rows for the space and count */
  .dk-split { flex-wrap: nowrap; padding-top: 22px; }
  .dk-prof, .dk-fav { min-height: 0; }
  .pf-grid { flex: 1 1 auto; min-height: 0; max-height: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
    grid-template-rows: repeat(6, minmax(0, 1fr)); overflow: hidden; }
  .pf-row { width: auto; height: auto; min-height: 0; }
  .pf-hint { grid-column: 1 / -1; grid-row: span 2; }
  .pf-grid.tight .pf-val { font-size: 21px; line-height: 23px; } .pf-grid.tight .pf-val.long { font-size: 17px; }
  .pf-grid.tight .pf-lbl { margin-top: 2px; font-size: 12px; }
  .pf-grid.tight .pf-row { padding: 0 12px; }
  #page-deck .keys { flex: 1 1 auto; min-height: 0; max-height: none; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
    overflow: hidden; align-content: stretch; }
  #page-deck .keys.scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; align-content: start; }
  #page-deck .key { width: auto; height: auto; min-height: 0; overflow: hidden; }
  #page-deck .keys.scroll .key { height: 96px; }
  #page-deck .key .ico, #page-deck .key .glyph { width: var(--ico, 64px); height: var(--ico, 64px); }
  #page-deck .key .glyph.keys { width: auto; min-width: var(--ico, 64px); }
  #page-deck .key .lbl { margin-top: 10px; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #page-deck .keys.small .key .lbl { margin-top: 6px; font-size: 13px; }
  #page-deck .keys.small .key { padding: 4px 6px; }
  #page-deck .keys.small .key .lbl { margin-top: 4px; line-height: 16px; }
  #page-deck .deck-empty { grid-column: 1 / -1; }
  .dk-seg { display: none; }
  .tab { max-width: 30vw; }

  /* ---- tablet portrait + phone portrait: stack the columns */
  .sz-m .sm, .sz-s .sm { flex-direction: column; }
  .sz-m .sm-np, .sz-s .sm-np { margin-right: 0; flex: 1 0 auto; justify-content: flex-start; }

  .sz-m .pf-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(4, minmax(0, 1fr)); }

  /* ---- phone portrait: one deck pane at a time, compact type */
  .sz-s .page { padding-left: 16px; padding-right: 16px; }

  .sz-s .page .phead .meta { margin-left: 10px; font-size: 14px; }
  .sz-s .page .settings-btn { margin-right: 0 !important; }
  .sz-s .batt { margin-right: 10px; }
  .sz-s .sm { padding-top: 18px; }
  .sz-s .sm .art { width: 76px; height: 76px; margin-bottom: 14px; border-radius: 10px; }
  .sz-s .sm #np-title { font-size: 28px; line-height: 33px; -webkit-line-clamp: 2; }
  .sz-s .sm #np-artist { font-size: 17px; margin-top: 4px; }
  .sz-s .sm .scrub { margin-top: 10px; }
  .sz-s .sm-transport { justify-content: space-between; margin-top: 8px; }
  .sz-s .sm-transport > * + * { margin-left: 0; }
  .sz-s .oc { width: 48px; height: 48px; }
  .sz-s .pill-pp { height: 48px; padding: 0 20px; }
  .sz-s .sm-side { margin-top: 18px; }
  .sz-s .sm-level { margin-bottom: 10px; margin-right: 20px; }

  .sz-s .sm-num.muted-num { font-size: 28px; }
  .sz-s .sm-row { height: 44px; }

  .sz-s .dk-seg { display: flex; flex: 0 0 auto; margin-top: 14px; padding: 3px; border-radius: 12px; background: var(--fill); }
  .sz-s .dk-seg button { flex: 1 1 0; min-width: 0; height: 38px; border-radius: 9px; font-size: 15px; font-weight: 600; color: var(--label2);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 8px; }
  .sz-s .dk-seg button.on { background: var(--card); color: var(--label); box-shadow: 0 1px 3px rgba(0,0,0,.18); }
  .sz-s .dk-split { padding-top: 14px; }
  .sz-s .dk-prof { flex: 1 1 auto; max-width: none; margin-right: 0; }
  .sz-s .dk-fav { flex: 1 1 auto; }
  .sz-s .dk-split.pane-fav .dk-prof, .sz-s .dk-split:not(.pane-fav) .dk-fav { display: none; }
  .sz-s .pf-head, .sz-s .fav-head { height: 52px; margin-bottom: 12px; }
  .sz-s .pf-head img, .sz-s .pf-head .pf-ph { width: 48px; height: 48px; border-radius: 11px; margin-right: 12px; }
  .sz-s .pf-name { font-size: 24px; line-height: 28px; }
  .sz-s .tab { width: 104px; }

  /* ---- short landscape (phone on its side): side by side, everything tighter */
  .sz-x .page { padding: 8px 20px var(--tab-h); padding-top: calc(8px + env(safe-area-inset-top));
    padding-left: calc(20px + env(safe-area-inset-left)); padding-right: calc(20px + env(safe-area-inset-right)); }
  .sz-x .page .phead { padding-bottom: 6px; }
  .sz-x .page .settings-btn, .sz-x .gbtn.icon { width: 36px; height: 36px; }
  .sz-x .sm { padding-top: 12px; }
  .sz-x .dk-split { padding-top: 10px; }
  .sz-x .sm .art { display: none; }
  .sz-x .sm-np { margin-right: 32px; }
  .sz-x .sm #np-title { font-size: 24px; line-height: 28px; -webkit-line-clamp: 2; margin-top: 4px; }
  .sz-x .sm #np-artist { font-size: 15px; margin-top: 2px; }
  .sz-x .sm .scrub { margin-top: 4px; }
  .sz-x .sm-transport { margin-top: 4px; }
  .sz-x .oc { width: 44px; height: 44px; } .sz-x .pill-pp { height: 44px; padding: 0 18px; }
  .sz-x .sm-side { flex-basis: 290px; }
  .sz-x .sm-level { margin-bottom: 4px; }
  .sz-x .sm-num { font-size: 30px; line-height: 32px; }
  .sz-x .sm-row { height: 40px; font-size: 15px; }

  .sz-x .dk-prof { flex: 1 1 0; max-width: none; margin-right: 28px; }
  .sz-x .dk-fav { flex: 1 1 0; }
  .sz-x .pf-head, .sz-x .fav-head { height: 40px; margin-bottom: 8px; }
  .sz-x .pf-head img, .sz-x .pf-head .pf-ph { width: 36px; height: 36px; border-radius: 9px; margin-right: 10px; }
  .sz-x .pf-head .sm-eyebrow { display: none; }
  .sz-x .pf-name { font-size: 20px; line-height: 24px; }
  .sz-x .tabbar { padding: 4px; bottom: calc(6px + env(safe-area-inset-bottom)); }
  .sz-x .tab { width: 104px; height: 44px; }
  .sz-x .tab svg { width: 21px; height: 21px; }
  .sz-x .tab span { font-size: 10px; line-height: 12px; margin-top: 1px; }

  .sm #np-card { overflow: visible; }
  .sz-m .sm #np-card, .sz-s .sm #np-card { flex: 1 0 auto; }
  .sm-link { white-space: nowrap; }

  /* short landscape: three columns (grid), so nothing has to stack */
  .sz-x .sm { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: auto 1fr;
    -webkit-column-gap: 28px; column-gap: 28px; }
  .sz-x .sm-side { display: contents; }
  .sz-x .sm-np { grid-column: 1; grid-row: 1 / 3; margin-right: 0; }
  .sz-x #vol-card { grid-column: 2; grid-row: 1; margin-bottom: 8px; }
  .sz-x #mic-card { grid-column: 2; grid-row: 2; align-self: start; }
  .sz-x .sm-dev { grid-column: 3; grid-row: 1 / 3; min-width: 0; }

  .sz-x .sm-transport { justify-content: space-between; }
  .sz-x .sm-transport > * + * { margin-left: 6px; }
  .sz-x .pill-pp { width: 52px; padding: 0; justify-content: center; }
  .sz-x .pill-pp svg { margin-right: 0; }
  .sz-x #pp-text { display: none; }
  .sz-short .sm .art { display: none; }
  .sz-short .sm #np-title { font-size: 24px; line-height: 29px; }
  .sz-short .sm-num { font-size: 30px; line-height: 34px; }

  #page-deck .key.ghost { pointer-events: none; -webkit-animation: none; animation: none; }
  .sz-x .pf-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(4, minmax(0, 1fr)); }
  .sz-x .fav-head .sm-eyebrow { display: none; }

  #toast { position: fixed; left: 50%; bottom: 100px; -webkit-transform: translateX(-50%); transform: translateX(-50%);
    background: var(--red); color: #fff; padding: 12px 18px; border-radius: 14px; font-size: 15px; opacity: 0;
    -webkit-transition: opacity .2s; transition: opacity .2s; pointer-events: none; max-width: 90%; }
  #toast.show { opacity: 1; }
  #tokenbox { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg); display: none;
    align-items: center; justify-content: center; z-index: 9; }
  #tokenbox.show { display: flex; }
  #tokenbox .card { width: 440px; max-width: 92%; }
  #tokenbox input { width: 100%; font-size: 17px; padding: 14px; border-radius: 12px; border: 0; background: var(--fill);
    color: var(--label); margin: 12px 0 14px; -webkit-user-select: text; user-select: text; }
  #tokenbox button { width: 100%; height: 50px; border-radius: 14px; background: var(--accent); color: #fff;
    font-size: 17px; font-weight: 600; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

</head>
<body>

<!-- ============================================================ MAC -->
<section class="page" id="page-mac" role="tabpanel" aria-labelledby="tab-mac">
  <div class="phead">
    <div>
      <h1>Mac</h1>
      <div class="meta"><span class="dot" id="mac-dot"></span><span id="mac-conn">Connecting…</span></div>
    </div>
    <div class="hright">

      <div class="clock"></div>
    </div>
  </div>

  <div class="sm" id="sm">
    <!-- now playing: type-led, no card -->
    <div class="sm-np" id="np-card">
      <img class="np-bg" id="np-bg" alt="" aria-hidden="true">
      <div class="sm-top">
        <div class="art" id="art">
          <img id="art-img" alt="Artwork">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 3v12.5a3.5 3.5 0 1 1-2-3.16V7.2l-8 1.8v8.5a3.5 3.5 0 1 1-2-3.16V5.4z"/></svg>
        </div>
        <div class="sm-eyebrow" id="np-app">Now Playing</div>
        <div id="np-title">—</div>
        <div id="np-artist">&nbsp;</div>
      </div>
      <div class="sm-bottom">
        <div class="scrub" id="scrub" style="visibility:hidden">
          <input type="range" id="pos" min="0" max="100" step="1" value="0" aria-label="Playback position">
          <div class="times"><span id="t-el">0:00</span><span id="t-rem">0:00</span></div>
        </div>
        <div class="sm-transport">
          <button class="oc press" id="back15" aria-label="Back 15 seconds">−15</button>
          <button class="oc press" data-media="previous" aria-label="Previous"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h2v12H6zM9.5 12 18 6v12z"/></svg></button>
          <button class="pill-pp press" data-media="playpause" aria-label="Play or pause"><svg viewBox="0 0 24 24" id="pp-icon" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"/></svg><span id="pp-text">Play</span></button>
          <button class="oc press" data-media="next" aria-label="Next"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
          <button class="oc press" id="fwd15" aria-label="Forward 15 seconds">+15</button>
        </div>
      </div>
    </div>

    <!-- levels + devices -->
    <div class="sm-side">
      <div class="sm-level" id="vol-card">
        <div class="sm-head"><span class="sm-eyebrow">Volume</span><button class="sm-link" id="mute" aria-pressed="false">Mute</button></div>
        <div class="sm-num" id="vol-val">–</div>
        <input type="range" class="thin" id="vol" min="0" max="100" step="1" value="0" aria-label="Volume">
      </div>
      <div class="sm-level" id="mic-card">
        <div class="sm-head"><span class="sm-eyebrow">Microphone</span><button class="sm-link warn" id="mic-mute" aria-pressed="false">Mute Mic</button></div>
        <div class="sm-num" id="mic-val">–</div>
        <input type="range" class="thin" id="mic" min="0" max="100" step="1" value="0" aria-label="Microphone level">
      </div>
      <div class="sm-dev" id="dev-card">
        <span class="sm-eyebrow">Output</span>
        <div id="outs" role="radiogroup" aria-label="Output device"></div>
        <button class="sm-row" id="in-row" aria-haspopup="dialog"><span>Input · <span id="in-name">–</span></span><svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button>
      </div>
    </div>
  </div>
</section>

<!-- ============================================================ DECK -->
<section class="page" id="page-deck" role="tabpanel" aria-labelledby="tab-deck">
  <div class="phead">
    <div>
      <h1>Deck</h1>
      <div class="meta"><span class="dot" id="deck-dot"></span><span id="deck-meta">Connecting…</span></div>
    </div>
    <div class="hright">
      <button class="gbtn" id="deck-edit" aria-pressed="false" style="margin-right:10px">Edit</button>
      <button class="gbtn icon settings-btn" aria-label="Appearance" style="margin-right:14px"><svg viewBox="0 0 24 24"><path d="M12 2.5a9.5 9.5 0 1 0 0 19 9.5 9.5 0 0 0 0-19zm0 2v15a7.5 7.5 0 0 1 0-15z"/></svg></button>
      <div class="clock"></div>
    </div>
  </div>
  <div class="dk-seg" id="dk-seg" role="tablist" aria-label="Deck view"><button data-pane="prof" role="tab" class="on" aria-selected="true" id="seg-prof">In front</button><button data-pane="fav" role="tab" aria-selected="false">Favourites</button></div>
  <div class="dk-split" id="dk-split">
    <div class="dk-prof" id="prof" aria-live="polite"></div>
    <div class="dk-fav">
      <div class="fav-head"><span class="sm-eyebrow">Favourites</span><div class="pager" id="pager" role="tablist" aria-label="Deck pages"></div></div>
      <div class="keys" id="keys"><div class="hint deck-empty">Loading…</div></div>
    </div>
  </div>
</section>

<!-- ============================================================ TAB BAR -->
<div class="edge" aria-hidden="true"></div>
<nav class="tabbar" role="tablist" aria-label="Sections">
  <button class="tab" role="tab" id="tab-mac" data-page="mac" aria-controls="page-mac">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 4h15A1.5 1.5 0 0 1 21 5.5V15H3V5.5A1.5 1.5 0 0 1 4.5 4zM1 16.5h22v.5a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2z"/></svg>
    <span>Mac</span>
  </button>
  <button class="tab" role="tab" id="tab-deck" data-page="deck" aria-controls="page-deck">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4.5A1.5 1.5 0 0 1 4.5 3h3A1.5 1.5 0 0 1 9 4.5v3A1.5 1.5 0 0 1 7.5 9h-3A1.5 1.5 0 0 1 3 7.5zm6 0A1.5 1.5 0 0 1 10.5 3h3A1.5 1.5 0 0 1 15 4.5v3A1.5 1.5 0 0 1 13.5 9h-3A1.5 1.5 0 0 1 9 7.5zM15 4.5A1.5 1.5 0 0 1 16.5 3h3A1.5 1.5 0 0 1 21 4.5v3A1.5 1.5 0 0 1 19.5 9h-3A1.5 1.5 0 0 1 15 7.5zM3 10.5A1.5 1.5 0 0 1 4.5 9h3A1.5 1.5 0 0 1 9 10.5v3A1.5 1.5 0 0 1 7.5 15h-3A1.5 1.5 0 0 1 3 13.5zm6 0A1.5 1.5 0 0 1 10.5 9h3a1.5 1.5 0 0 1 1.5 1.5v3a1.5 1.5 0 0 1-1.5 1.5h-3A1.5 1.5 0 0 1 9 13.5zm6 0A1.5 1.5 0 0 1 16.5 9h3a1.5 1.5 0 0 1 1.5 1.5v3a1.5 1.5 0 0 1-1.5 1.5h-3a1.5 1.5 0 0 1-1.5-1.5zM3 16.5A1.5 1.5 0 0 1 4.5 15h3A1.5 1.5 0 0 1 9 16.5v3A1.5 1.5 0 0 1 7.5 21h-3A1.5 1.5 0 0 1 3 19.5zm6 0A1.5 1.5 0 0 1 10.5 15h3a1.5 1.5 0 0 1 1.5 1.5v3a1.5 1.5 0 0 1-1.5 1.5h-3A1.5 1.5 0 0 1 9 19.5zm6 0a1.5 1.5 0 0 1 1.5-1.5h3a1.5 1.5 0 0 1 1.5 1.5v3a1.5 1.5 0 0 1-1.5 1.5h-3a1.5 1.5 0 0 1-1.5-1.5z" transform="scale(.92) translate(1 1)"/></svg>
    <span>Deck</span>
  </button>
</nav>

<div id="toast" role="status" aria-live="polite"></div>
<div id="tokenbox">
  <div class="card">
    <div class="eyebrow">Access Token</div>
    <div class="hint">Scan the pairing QR code again, or on the Mac run <code>deckside pair</code> and enter the token it shows.</div>
    <input id="token-in" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Access token">
    <button id="token-save">Connect</button>
  </div>
</div>

  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-head">
      <h3 id="sheet-title"></h3>
      <button class="textbtn" id="sheet-close">Done</button>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>
</div>

<script>

  // ---- Keys builder: modifiers + one key (+ optional target app)
  var SPECIAL = [['', 'Special key…'], ['return', 'Return ↩'], ['tab', 'Tab ⇥'], ['space', 'Space'], ['escape', 'Escape ⎋'],

  function keysBuilder(body, idx) {

      '<div class="sublabel">Key</div><div class="flex"><input class="field grow" id="kb-key" maxlength="1" autocapitalize="off" autocorrect="off" placeholder="Letter, number or symbol" value="' + esc(kb.key) + '">' +
      '<select class="field grow" id="kb-special" aria-label="Special key">' + sp + '</select></div>' +
      '<div class="sublabel">Send to</div><select class="field" id="kb-app">' + appOptions(kb.app, 'Frontmost app') + '</select>' +

  // ---- Multi-action builder: up to 10 steps run in order on the Mac

  function multiBuilder(body, idx) {

        '<button data-add="keys">+ Keys</button><button data-add="wait">+ Wait</button><button data-add="volume">+ Volume</button><button data-add="mic">+ Mic</button></div>' : '') +

    if (!el || el === this) { return; }
    target = null;
    if (el.getAttribute('data-addkey')) { openAdd(); return; }
    var id = el.getAttribute('data-key'), idx = findBtn(id);
    if (idx < 0) { return; }
    if (editing) {
      if (e.target.className === 'badge-x') { deck.pages[curPage].buttons.splice(idx, 1); renderDeck(); saveDeck(); return; }
      openEditBtn(idx); return;
    }
    el.className += ' flash';
    setTimeout(function () { el.className = el.className.replace(' flash', ''); }, 450);
    deckApi('POST', '/api/deck/press', { page: curPage, id: id }, applyDeck);
  });
  document.addEventListener('click', function (e) {
    var t = e.target;
    if (t.getAttribute && t.getAttribute('data-at')) { showAddTab(t.getAttribute('data-at')); return; }
    while (t && t !== document && !(t.getAttribute && (t.getAttribute('data-app') || t.getAttribute('data-sc')))) { t = t.parentNode; }
    if (!t || t === document) { return; }
    if (t.getAttribute('data-app')) { addButton({ type: 'app', bundle: t.getAttribute('data-app'), label: t.getAttribute('data-name') }); }
    else { addButton({ type: 'shortcut', name: t.getAttribute('data-sc'), label: t.getAttribute('data-sc') }); }
  });
  $('prof').addEventListener('click', function (e) {
    var t = e.target, del = t.getAttribute && t.getAttribute('data-pdel');
    while (t && t !== this && !t.getAttribute('data-pkey') && !t.getAttribute('data-padd')) { t = t.parentNode; }
    if (!t || t === this || !front) { return; }
    target = front;
    if (t.getAttribute('data-padd')) { openAdd(); return; }
    var id = t.getAttribute('data-pkey'), list = tlist(), idx = -1;
    for (var i = 0; i < list.length; i++) { if (list[i].id === id) { idx = i; } }
    if (idx < 0) { return; }
    if (editing) {
      if (del) { list.splice(idx, 1); renderDeck(); saveDeck(); return; }
      openEditBtn(idx); return;
    }
    pressedKey = id; pressedAt = Date.now(); t.className += ' flash';
    setTimeout(function () { var el = document.querySelector('.pf-row.flash'); if (el) { el.className = el.className.replace(' flash', ''); } }, 500);
    deckApi('POST', '/api/deck/press', { profile: front, id: id }, applyDeck);
  });
  // swipe between pages
  (function () {
    var x0 = null, y0 = null;
    $('keys').addEventListener('touchstart', function (e) { if (e.touches.length === 1) { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; } });
    $('keys').addEventListener('touchend', function (e) {
      if (x0 === null || !deck || editing) { return; }
      var dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
      if (Math.abs(dx) > 80 && Math.abs(dx) > 2 * Math.abs(dy)) {
        var np = curPage + (dx < 0 ? 1 : -1);
        if (np >= 0 && np < deck.pages.length) { curPage = np; store('decksideDeckPage', String(np)); renderDeck(); }
      }
    });
  })();
  curPage = +(store('decksideDeckPage') || 0) || 0;

  // ================================================================ appearance
  function openAppearance() {
    var cur = window.__getTheme ? window.__getTheme() : 'auto';
    openSheet('Appearance', '<div class="seg" id="ap-seg"><button data-th="auto">Auto</button><button data-th="light">Light</button><button data-th="dark">Dark</button></div>' +
      '<div class="hint" id="ap-hint"></div>');
    function mark(v) {
      var bs = $('ap-seg').getElementsByTagName('button');
      for (var i = 0; i < bs.length; i++) { bs[i].className = bs[i].getAttribute('data-th') === v ? 'on' : ''; }
      $('ap-hint').textContent = v === 'auto' ? 'Follows the iPad: warm light by day, dark at night.' :
        v === 'light' ? 'Warm, paper-toned light mode.' : 'Dark mode — easiest on the eyes for a wall panel.';
    }
    $('ap-seg').addEventListener('click', function (e) {
      var v = e.target.getAttribute('data-th'); if (!v) { return; }
      window.__setTheme(v); mark(v);
    });
    mark(cur);
  }
  var sbs = document.querySelectorAll('.settings-btn');
  for (var sb = 0; sb < sbs.length; sb++) { sbs[sb].addEventListener('click', openAppearance); }

  // ================================================================ lifecycle
  function stop() { while (timers.length) { clearInterval(timers.pop()); } }
  function start() {
    stop();
    req('GET', '/api/config', token, null, function (c) {
      mac.urls = c.mac_urls || []; mac.idx = 0; mac.fails = 0; mac.token = c.mac_token;
      if (!mac.urls.length) {
        $('mac-conn').textContent = 'Not connected';
        $('mac-dot').className = 'dot';
      } else {
        macApi('GET', '/api/state');
        timers.push(setInterval(function () { macApi('GET', '/api/state'); }, 2000));
        loadDeck();
        timers.push(setInterval(function () {
          if (!editing && $('page-deck').className.indexOf(' on') >= 0 && $('sheet-bg').className.indexOf('show') < 0) { loadDeck(); }
        }, 2000));
      }
    }, function (st) { if (st === 401) { askToken(); } });
  }
  function askToken() { stop(); $('tokenbox').className = 'show'; }
  $('token-save').addEventListener('click', function () {
    token = $('token-in').value.replace(/\s/g, '');
    store('decksideToken', token);
    $('tokenbox').className = '';
    start();
  });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { stop(); } else if (token) { start(); }
  });

  showPage(startTab);
  tick(); setInterval(tick, 10000);
  if (token) { start(); } else { askToken(); }
})();
</script>
</body>
</html>
